<!DOCTYPE html>

  <head>

    <meta name="description" content="A simple portfolio website template." />
    <link rel="stylesheet" href="styles.css" />

    <header>

            <div id="cursor-overlay" class="screen-overlay"></div>

                </video>
            </div>
        </div>

      <div class="container">
        <nav>
          <div class="logo">MYPORTFOLIO</div>
          <div class="nav-links">
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>

        </nav>
      </div>
    </header>

    <footer id="contact">
      <div class="container">
        <p>© 2026 Your Name | hello@example.com</p>
      </div>
    </footer>
  </body>
</html>
